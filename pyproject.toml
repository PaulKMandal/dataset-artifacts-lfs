[project]
name = "dataset-artifacts"
version = "0.2.0"
description = "Dataset cartography and adversarial SQuAD experiments"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "accelerate==0.30.1",
  "datasets==2.19.2",
  "evaluate==0.4.2",
  "matplotlib==3.8.4",
  "nltk==3.8.1",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pyarrow==16.1.0",
  "pyyaml==6.0.1",
  "scipy==1.13.1",
  "tqdm==4.66.4",
  "transformers==4.41.2",
]

[project.optional-dependencies]
cpu = [
  "torch==2.3.1+cpu",
]
cuda = [
  "torch==2.3.1+cu121",
]

[dependency-groups]
dev = [
  "pytest==8.2.2",
  "ruff==0.5.0",
]

[tool.uv]
package = false
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu121", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
