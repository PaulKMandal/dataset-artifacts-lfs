# Run 6: DeBERTa-v3-base reduced model-specific cartography panel.
# This follows the PI freeze rule: run DeBERTa only if higher-priority panels are
# done, and treat as appendix/exploratory. Batch size is conservative for 24 GB.

panel:
  name: run6_deberta_v3_base
  results_dir: results/run6_deberta_v3_base
  resume: true
  gpu_ids: [0]
  parallel_workers: 1

model:
  short_name: deberta_v3_base
  name_or_path: microsoft/deberta-v3-base
  max_seq_length: 384

training:
  num_train_epochs: 3
  same_steps_fallback_max_steps: 8214
  learning_rate: 5.0e-5
  warmup_ratio: 0.0
  weight_decay: 0.0
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  fp16: true
  fp16_eval: true

data:
  data_dir: data/qa
  subsets_dir: data/subsets/run6_deberta_v3_base
  squad_train: data/qa/squad_train.jsonl
  evalsets:
    squad_dev: data/qa/squad_dev.jsonl
    addsent: data/qa/addsent.jsonl
    addonesent: data/qa/addonesent.jsonl
  squad_train_json: null
  squad_dev_json: null
  addsent_json: null
  addonesent_json: null

cartography:
  source_seed: 42
  primary: joint
  random_draws: 5
  random_seed_base: 7300
  subset_fractions: [0.333]
  limit_scatter_samples: 20000
  definitions:
    joint:
      field: joint_confidence
      label: joint_gold_span_probability

experiments:
  full_baseline:
    enabled: true
    seeds: [13, 21, 42]
  random_33:
    enabled: true
    fraction: 0.333
    seeds: [42]
    random_draws: 5
  easy_33:
    enabled: false
    fraction: 0.333
    seeds: []
  ambiguous_33:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42]
  hard_33:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42]
  random_33_same_steps: {enabled: false}
  hard_33_same_steps: {enabled: false}
  budget_10: {enabled: false}
  budget_20: {enabled: false}
  budget_50: {enabled: false}
  confidence_ablation: {enabled: false}
