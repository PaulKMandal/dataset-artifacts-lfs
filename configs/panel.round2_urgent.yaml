# Round-2 urgent ELECTRA-small repair panel.
# Run after the current seed-13/seed-42 outputs are in place; the runner is resumable.

panel:
  name: electra_small_round2_urgent
  results_dir: results/panel_electra_small
  resume: true

model:
  short_name: electra_small
  name_or_path: google/electra-small-discriminator
  max_seq_length: 384

training:
  num_train_epochs: 3
  same_steps_fallback_max_steps: 8214
  learning_rate: 5.0e-5
  warmup_ratio: 0.0
  weight_decay: 0.0
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  fp16: true
  fp16_eval: true

data:
  data_dir: data/qa
  subsets_dir: data/subsets
  squad_train: data/qa/squad_train.jsonl
  evalsets:
    squad_dev: data/qa/squad_dev.jsonl
    addsent: data/qa/addsent.jsonl
    addonesent: data/qa/addonesent.jsonl
  squad_train_json: null
  squad_dev_json: null
  addsent_json: null
  addonesent_json: null

cartography:
  source_seed: 42
  primary: joint
  random_draws: 5
  random_seed_base: 7300
  subset_fractions: [0.333]
  region_pure_fractions: [0.198]
  limit_scatter_samples: 20000
  definitions:
    joint:
      field: joint_confidence
      label: joint_gold_span_probability
    endpoint:
      field: confidence
      label: endpoint_mean_gold_probability
    neg_loss:
      field: negative_gold_span_loss
      label: negative_gold_span_loss
    gold_window_only:
      field: joint_confidence
      label: joint_gold_span_probability_gold_window_only
      window_policy: gold_only

experiments:
  full_baseline:
    enabled: true
    seeds: [13, 21, 42]
  random_33:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42]
    random_draws: 5
  easy_33:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42]
  ambiguous_33:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42]
  hard_33:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42]
  region_pure_198:
    enabled: true
    fraction: 0.198
    subsets: [easy, ambiguous, hard]
    seeds: [42]
  random_33_same_steps:
    enabled: true
    fraction: 0.333
    seeds: [42]
    random_draws: 5
  hard_33_same_steps:
    enabled: true
    fraction: 0.333
    seeds: [42]
  budget_10:
    enabled: false
  budget_20:
    enabled: false
  budget_50:
    enabled: false
  confidence_ablation:
    enabled: true
    fraction: 0.333
    definitions: [endpoint, neg_loss, gold_window_only]
    subsets: [easy, ambiguous, hard]
    seeds: [42]
