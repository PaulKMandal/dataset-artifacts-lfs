# Full ELECTRA-small panel for clean-SQuAD cartography vs adversarial QA robustness.
# Launch on the GPU server inside the Nix shell:
#   scripts/run_full_panel.sh configs/panel.full.yaml

panel:
  name: electra_small_cartography_full_panel
  results_dir: results/panel_electra_small
  resume: true

model:
  short_name: electra_small
  name_or_path: google/electra-small-discriminator
  max_seq_length: 384

training:
  num_train_epochs: 3
  same_steps_fallback_max_steps: 8214  # replaced by full seed-42 trainer_state.global_step when available
  learning_rate: 5.0e-5
  warmup_ratio: 0.0
  weight_decay: 0.0
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  fp16: true
  fp16_eval: true

# The panel materializes these files from HF datasets unless local source JSONs
# are supplied. The generated dataset_manifest.json records counts and hashes.

data:
  data_dir: data/qa
  subsets_dir: data/subsets
  squad_train: data/qa/squad_train.jsonl
  evalsets:
    squad_dev: data/qa/squad_dev.jsonl
    addsent: data/qa/addsent.jsonl
    addonesent: data/qa/addonesent.jsonl
  # Optional frozen local SQuAD-v1 JSON sources. Leave null to download via HF datasets.
  squad_train_json: null
  squad_dev_json: null
  addsent_json: null
  addonesent_json: null

cartography:
  source_seed: 42
  primary: joint
  random_draws: 10
  random_seed_base: 7300
  subset_fractions: [0.10, 0.20, 0.333, 0.50]
  limit_scatter_samples: 20000
  definitions:
    joint:
      field: joint_confidence
      label: joint_gold_span_probability
    endpoint:
      field: confidence
      label: endpoint_mean_gold_probability
    neg_loss:
      field: negative_gold_span_loss
      label: negative_gold_span_loss

experiments:
  # Tier A
  full_baseline:
    enabled: true
    seeds: [13, 21, 42, 87, 100]
  random_33:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42]
    random_draws: 10
  easy_33:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42, 87, 100]
  ambiguous_33:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42, 87, 100]
  hard_33:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42, 87, 100]

  # Tier B
  random_33_same_steps:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42]
    random_draws: 5
  hard_33_same_steps:
    enabled: true
    fraction: 0.333
    seeds: [13, 21, 42]
  budget_10:
    enabled: true
    fraction: 0.10
    subsets: [random, easy, ambiguous, hard]
    seeds: [42]
    random_draws: 5
  budget_20:
    enabled: true
    fraction: 0.20
    subsets: [random, easy, ambiguous, hard]
    seeds: [42]
    random_draws: 5
  budget_50:
    enabled: true
    fraction: 0.50
    subsets: [random, easy, ambiguous, hard]
    seeds: [42]
    random_draws: 5
  confidence_ablation:
    enabled: true
    fraction: 0.333
    definitions: [endpoint, neg_loss]
    subsets: [easy, ambiguous, hard]
    seeds: [42]
